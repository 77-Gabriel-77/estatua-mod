buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'

version = '1.0.0'
group = 'br.com.estatua'
archivesBaseName = 'estatuapersonalizada'

java.toolchain.languageVersion = JavaLanguageVersion.of(8)

minecraft {
    // O codigo usa os nomes OFICIAIS (Mojang): useOn, getLevel, getClickedPos...
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { estatuapersonalizada { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { estatuapersonalizada { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.39'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'estatuapersonalizada',
            'Specification-Vendor'    : 'Estatua Personalizada',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.version,
            'Implementation-Vendor'   : 'Estatua Personalizada'
        ])
    }
}

// OBRIGATORIO: converte os nomes oficiais para SRG, senao o jar nao carrega no Minecraft real.
jar.finalizedBy('reobfJar')
